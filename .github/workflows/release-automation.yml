name: Release Automation

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Type of version bump'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Build project
      run: |
        cargo build --release

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: binary-amd64
        path: target/release/lilo-et-stych

  release:
    needs: [build-amd64]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Install cargo-edit
      run: cargo install cargo-edit
    
    - name: Install git-cliff
      run: cargo install git-cliff
    
    - name: Bump version
      run: |
        cargo set-version --bump ${{ github.event.inputs.version_bump }}
        VERSION=$(grep '^version =' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
        echo "NEW_VERSION=v$VERSION" >> $GITHUB_ENV
    
    - name: Generate changelog
      run: |
        git cliff --config cliff.toml --tag ${{ env.NEW_VERSION }} > CHANGELOG.md
    
    - name: Commit and push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add Cargo.toml Cargo.lock CHANGELOG.md
        git commit -m "Release ${{ env.NEW_VERSION }}"
        git push origin main
    
    - name: Create and push tag
      run: |
        git tag ${{ env.NEW_VERSION }}
        git push origin ${{ env.NEW_VERSION }}
    
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: List downloaded artifacts
      run: ls -R artifacts
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: Release ${{ env.NEW_VERSION }}
        tag_name: ${{ env.NEW_VERSION }}
        body_path: CHANGELOG.md
        draft: false
        prerelease: false
        files: |
          artifacts/binary-amd64/lilo-et-stych
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
