name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        target: ${{ matrix.target }}
        override: true

    - name: Build binary
      run: cargo build --target ${{ matrix.target }} --release --verbose

    - name: Install cargo-deb
      run: cargo install cargo-deb

    - name: Build .deb package
      run: cargo deb --target ${{ matrix.target }}
    
    - name: Rename artifacts with target architecture
      run: |
        mkdir -p target/artifacts
        cp target/${{ matrix.target }}/release/lilo-et-stych target/artifacts/lilo-et-stych-${{ matrix.target }}
        if [ -f "target/${{ matrix.target }}/debian/"*.deb ]; then
          cp target/${{ matrix.target }}/debian/*.deb target/artifacts/
        fi

    - name: Check files exist
      run: |
        ls -l target/artifacts/

    - name: Create GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        name: Release ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        files: |
          target/artifacts/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}