[package]
name = "lilo-et-stych"
version = "0.2.0"
edition = "2021"
authors = ["Contributors to lilo-et-stych"]
description = "A Rust library and bot for interacting with Stych.fr driving school platform and Matrix chat"
license = "MIT"
repository = "https://github.com/baptistemillou/lilo-et-stych"
keywords = ["stych", "driving-school", "matrix", "bot", "api"]
categories = ["api-bindings", "web-programming"]

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }

# HTTP client
reqwest = { version = "0.11", features = ["gzip", "json", "deflate", "brotli"] }

# Matrix SDK
matrix-sdk = { version = "0.7", features = ["e2e-encryption", "sqlite"] }

# Configuration management
config = "0.13"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Logging
log = "0.4"
env_logger = "0.10"

# Utilities
once_cell = "1.19"
thiserror = "1.0"

# Command-line argument parsing
clap = { version = "4.0", features = ["derive", "env"] }

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.2"

[[bin]]
name = "lilo-et-stych"
path = "src/bin/main.rs"

[package.metadata.deb]
maintainer = "Contributors to lilo-et-stych"
copyright = "2025, Contributors to lilo-et-stych"
license-file = ["LICENSE", "0"]
extended-description = """\
A Rust library and bot for interacting with Stych.fr driving school platform and Matrix chat."""
depends = "libc6, libgcc1, libssl1.1"
section = "net"
priority = "optional"
assets = [
    ["target/*/release/lilo-et-stych", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/lilo-et-stych/README", "644"],
    ["LICENSE", "usr/share/doc/lilo-et-stych/LICENSE", "644"],
]
